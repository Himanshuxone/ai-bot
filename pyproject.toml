[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "1.0.0"
description = "Secure, GDPR / EU AI Act-aware RAG pipeline for financial documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11,<2",
  "cryptography>=44",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=5",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
include = ["finrag*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
