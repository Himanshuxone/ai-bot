[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "1.0.0"
description = "Secure, GDPR / EU AI Act-aware RAG pipeline for financial documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11,<2",
  "cryptography>=44",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=5",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
include = ["finrag*"]

[tool.setuptools.package-data]
finrag = ["web/*", "web/js/*", "web/js/views/*", "demo_data/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["finrag/_assets.py"]  # generated by scripts/build_assets.py

[tool.ruff.lint]
# Explicit rule set so a newer ruff release cannot change what CI enforces.
select = [
  "E4", "E7", "E9", "F",   # pycodestyle errors, pyflakes
  "W",                     # includes W605 invalid escape sequences
  "I",                     # import sorting
  "UP",                    # pyupgrade
  "ISC",                   # implicit string concatenation (a missing comma hides a bug)
  "PLE",                   # pylint errors, incl. invisible/bidi characters in source
  "PLW1510", "PLR0402",
  "RUF100", "RUF007",
  "SIM905", "FURB167",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
