name: ci
on: [push, pull_request]
permissions:
  contents: read        # least privilege for the workflow token
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check finrag tests scripts
      - run: pytest -q
      - run: python scripts/compliance_report.py --check
      # Dependency vulnerability scan  [RULE: EUAIA-ART15] cybersecurity
      - run: pip-audit -r requirements.txt
